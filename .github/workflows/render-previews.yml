name: Render source output previews

on:
  push:
    branches: [main]
    paths:
      - '01-LaTeX/**'
      - '02-Beamer/**'
      - '03-Doxygen/**'
      - '.github/workflows/render-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install documentation and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra poppler-utils \
            doxygen g++ python3-pil imagemagick

      - name: Compile each LaTeX example and render its output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/latex
          for folder in 01-LaTeX/*/; do
            [ -f "${folder}main.tex" ] || continue
            name="$(basename "$folder")"
            echo "Building $name"
            (
              cd "$folder"
              pdflatex -interaction=nonstopmode -halt-on-error main.tex
              if [ "$name" = "07-bibliography" ]; then
                bibtex main
              elif [ "$name" = "08-index" ]; then
                makeindex main.idx
              fi
              pdflatex -interaction=nonstopmode -halt-on-error main.tex
              if [ "$name" = "07-bibliography" ]; then
                pdflatex -interaction=nonstopmode -halt-on-error main.tex
              fi
              pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
              page=1
              if [ "$name" = "08-index" ]; then page="$pages"; fi
              pdftoppm -f "$page" -l "$page" -singlefile -png -r 115 \
                main.pdf "$GITHUB_WORKSPACE/assets/images/latex/$name"
            )
          done

      - name: Compile Beamer slides and make a slide preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/beamer
          cd 02-Beamer
          pdflatex -interaction=nonstopmode -halt-on-error presentation.tex
          pdflatex -interaction=nonstopmode -halt-on-error presentation.tex
          pdfseparate presentation.pdf /tmp/beamer-slide-%d.pdf
          for pdf in /tmp/beamer-slide-*.pdf; do
            n="$(basename "$pdf" .pdf | sed 's/.*-//')"
            pdftoppm -f 1 -l 1 -singlefile -png -r 95 "$pdf" "/tmp/beamer-$n"
          done
          montage /tmp/beamer-[0-9]*.png -tile 2x -geometry 720x405+16+18 \
            -background '#e9edf2' ../assets/images/beamer/beamer-presentation.png

      - name: Build and run the documented C++ example
        shell: bash
        run: |
          set -euo pipefail
          cd 03-Doxygen/example
          g++ -std=c++17 -Wall -Wextra -pedantic main.cpp -o example
          ./example | tee /tmp/cpp-output.txt
          doxygen Doxyfile
          mkdir -p ../../assets/images/doxygen
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          width, height = 1040, 420
          image = Image.new("RGB", (width, height), "#1e1e1e")
          draw = ImageDraw.Draw(image)
          mono = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 19)
          small = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 15)
          draw.rounded_rectangle((5, 5, width-5, height-5), radius=13, fill="#1e1e1e", outline="#69717c", width=2)
          draw.rounded_rectangle((5, 5, width-5, 48), radius=13, fill="#e7e9ed")
          draw.rectangle((5, 30, width-5, 48), fill="#e7e9ed")
          for x, color in [(28, "#ff5f57"), (51, "#febc2e"), (74, "#28c840")]:
              draw.ellipse((x-7, 17, x+7, 31), fill=color)
          draw.text((width//2, 26), "Terminal — 03-Doxygen/example", font=small, fill="#333d49", anchor="mm")
          draw.text((32, 91), "$ g++ -std=c++17 -Wall -Wextra -pedantic main.cpp -o example", font=mono, fill="#a8c7fa")
          draw.text((32, 145), "$ ./example", font=mono, fill="#a8c7fa")
          outputs = Path("/tmp/cpp-output.txt").read_text().splitlines()
          for index, line in enumerate(outputs):
              draw.text((32, 205 + index*50), line, font=mono, fill="#c3e88d")
          draw.text((32, 335), "Process finished with exit code 0", font=mono, fill="#98c379")
          image.save("../../assets/images/doxygen/cpp-output.png")
          PY

      - name: Save generated previews in the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            git commit -m "Add compiled output previews"
            git push
          fi
