<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="t"><title id="t">Simple Git and GitHub workflow</title><rect width="1100" height="340" rx="18" fill="#f4f7fb"/><text x="550" y="48" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#172b4d">From your computer to GitHub</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="105" width="185" height="135" rx="14" fill="#e5efff" stroke="#3977d5" stroke-width="2"/><text x="127" y="150" font-size="21" font-weight="bold" fill="#173b70">Edit</text><text x="127" y="181" font-size="15" fill="#314b6b">Change your files</text><text x="127" y="205" font-size="15" fill="#314b6b">and check the diff</text><rect x="250" y="105" width="185" height="135" rx="14" fill="#fff0d8" stroke="#d48b25" stroke-width="2"/><text x="342" y="150" font-size="21" font-weight="bold" fill="#86510d">Stage</text><text x="342" y="181" font-size="15" fill="#6b512e">git add</text><text x="342" y="205" font-size="15" fill="#6b512e">Choose changes</text><rect x="465" y="105" width="185" height="135" rx="14" fill="#eee9fb" stroke="#7657c8" stroke-width="2"/><text x="557" y="150" font-size="21" font-weight="bold" fill="#52358b">Commit</text><text x="557" y="181" font-size="15" fill="#51416a">git commit</text><text x="557" y="205" font-size="15" fill="#51416a">Save a snapshot</text><rect x="680" y="105" width="185" height="135" rx="14" fill="#e5f5ec" stroke="#27956d" stroke-width="2"/><text x="772" y="150" font-size="21" font-weight="bold" fill="#145c42">Push</text><text x="772" y="181" font-size="15" fill="#315c4c">git push</text><text x="772" y="205" font-size="15" fill="#315c4c">Send to GitHub</text><rect x="895" y="105" width="170" height="135" rx="14" fill="#e2f3f3" stroke="#258b91" stroke-width="2"/><text x="980" y="150" font-size="21" font-weight="bold" fill="#14565a">Review</text><text x="980" y="181" font-size="15" fill="#315c5d">Pull request</text><text x="980" y="205" font-size="15" fill="#315c5d">Discuss + merge</text></g><g stroke="#8091a5" stroke-width="3" fill="none"><path d="M222 172 H242 l-9 -7 m9 7 l-9 7"/><path d="M437 172 H457 l-9 -7 m9 7 l-9 7"/><path d="M652 172 H672 l-9 -7 m9 7 l-9 7"/><path d="M867 172 H887 l-9 -7 m9 7 l-9 7"/></g><text x="550" y="292" text-anchor="middle" font-family="Arial" font-size="15" fill="#52657a">Keep commits small and describe what you changed in everyday language.</text></svg>