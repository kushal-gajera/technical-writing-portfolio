<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t"><title id="t">Example Beamer slide layout with frames, columns and blocks</title><rect width="1000" height="500" rx="18" fill="#f4f7fb"/><rect x="95" y="55" width="810" height="380" rx="14" fill="#fff" stroke="#9aabc0" stroke-width="2"/><rect x="95" y="55" width="810" height="60" rx="14" fill="#dfeaff"/><text x="500" y="93" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#193f77">Frame title — one clear message</text><rect x="130" y="145" width="350" height="235" rx="12" fill="#f1f6ff" stroke="#3977d5" stroke-width="2"/><text x="305" y="183" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#193f77">Column 1</text><rect x="160" y="210" width="290" height="65" rx="8" fill="#dfeaff"/><text x="305" y="250" text-anchor="middle" font-family="Arial" font-size="18" fill="#193f77">Block</text><rect x="160" y="290" width="290" height="65" rx="8" fill="#e5f5ec"/><text x="305" y="330" text-anchor="middle" font-family="Arial" font-size="18" fill="#145c42">Example block</text><rect x="520" y="145" width="350" height="235" rx="12" fill="#fff8e9" stroke="#d48b25" stroke-width="2"/><text x="695" y="183" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#86510d">Column 2</text><rect x="550" y="210" width="290" height="65" rx="8" fill="#fff0d8"/><text x="695" y="250" text-anchor="middle" font-family="Arial" font-size="18" fill="#86510d">Text or image</text><rect x="550" y="290" width="290" height="65" rx="8" fill="#f5e9df"/><text x="695" y="330" text-anchor="middle" font-family="Arial" font-size="18" fill="#86510d">Table / equation</text><text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="15" fill="#52657a">A Beamer document is made of frames; columns and blocks organise each slide.</text></svg>