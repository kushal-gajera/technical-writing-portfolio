<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t"><title id="t">Gnuplot turns data and a script into a graph</title><rect width="1000" height="300" rx="18" fill="#f4f7fb"/><g font-family="Arial" text-anchor="middle"><rect x="45" y="82" width="230" height="140" rx="14" fill="#e5efff" stroke="#3977d5" stroke-width="2"/><text x="160" y="132" font-size="22" font-weight="bold" fill="#173b70">Input files</text><text x="160" y="165" font-size="16" fill="#314b6b">sample-data.csv</text><text x="160" y="190" font-size="16" fill="#314b6b">progress-plot.gp</text><rect x="385" y="82" width="230" height="140" rx="14" fill="#fff0d8" stroke="#d48b25" stroke-width="2"/><text x="500" y="132" font-size="22" font-weight="bold" fill="#86510d">Gnuplot</text><text x="500" y="165" font-size="16" fill="#6b512e">Reads columns</text><text x="500" y="190" font-size="16" fill="#6b512e">Draws axes + lines</text><rect x="725" y="82" width="230" height="140" rx="14" fill="#e5f5ec" stroke="#27956d" stroke-width="2"/><text x="840" y="132" font-size="22" font-weight="bold" fill="#145c42">Graph image</text><text x="840" y="165" font-size="16" fill="#315c4c">PNG output</text><text x="840" y="190" font-size="16" fill="#315c4c">Ready for a report</text></g><g stroke="#8091a5" stroke-width="3" fill="none"><path d="M280 152 H375 l-12 -9 m12 9 l-12 9"/><path d="M620 152 H715 l-12 -9 m12 9 l-12 9"/></g><text x="500" y="265" text-anchor="middle" font-family="Arial" font-size="15" fill="#52657a">Change the CSV values or script, then run gnuplot again.</text></svg>