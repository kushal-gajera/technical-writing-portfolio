<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#f4f7fb"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#172b4d">The Technical Writing Workflow</text><g font-family="Arial" text-anchor="middle"><rect x="65" y="135" width="235" height="175" rx="18" fill="#e1efff" stroke="#3973ac" stroke-width="3"/><text x="182" y="195" font-size="25" font-weight="bold" fill="#174a78">1 · Plan</text><text x="182" y="238" font-size="17" fill="#24445f">Audience · purpose</text><text x="182" y="265" font-size="17" fill="#24445f">requirements</text><rect x="355" y="135" width="235" height="175" rx="18" fill="#e6f5ed" stroke="#39835c" stroke-width="3"/><text x="472" y="195" font-size="25" font-weight="bold" fill="#21633e">2 · Draft</text><text x="472" y="238" font-size="17" fill="#315443">Structure · content</text><text x="472" y="265" font-size="17" fill="#315443">examples</text><rect x="645" y="135" width="235" height="175" rx="18" fill="#fff1dd" stroke="#c17a24" stroke-width="3"/><text x="762" y="195" font-size="25" font-weight="bold" fill="#8e5412">3 · Review</text><text x="762" y="238" font-size="17" fill="#654b2a">Accuracy · clarity</text><text x="762" y="265" font-size="17" fill="#654b2a">consistency</text><rect x="935" y="135" width="235" height="175" rx="18" fill="#f1e9ff" stroke="#7952aa" stroke-width="3"/><text x="1052" y="195" font-size="25" font-weight="bold" fill="#563486">4 · Publish</text><text x="1052" y="238" font-size="17" fill="#51416a">Format · release</text><text x="1052" y="265" font-size="17" fill="#51416a">maintain</text></g><g stroke="#50677f" stroke-width="4" fill="none"><path d="M305 222 H345 M335 212 L345 222 L335 232"/><path d="M595 222 H635 M625 212 L635 222 L625 232"/><path d="M885 222 H925 M915 212 L925 222 L915 232"/></g><text x="600" y="370" text-anchor="middle" font-family="Arial" font-size="17" fill="#52657a">A repeatable process turns technical knowledge into useful documentation.</text></svg>