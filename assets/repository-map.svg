<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Technical Writing Portfolio — repository map</title>
<desc id="desc">A learner opens the README overview, which links to five clear learning areas: writing documents, presentations, code documentation, drawing and plotting, and version control.</desc>
<defs>
