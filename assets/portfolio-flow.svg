<rect class="card" x="912" y="104" width="184" height="104" rx="12"/>
<circle cx="937" cy="129" r="13" fill="#315b83"/><text x="937" y="134" text-anchor="middle" class="number">5</text>
<text x="1004" y="151" text-anchor="middle" class="heading" font-size="17">Share</text>
<text x="1004" y="177" text-anchor="middle" class="sub">Git · GitHub</text>
