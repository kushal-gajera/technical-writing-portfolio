<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">Technical Writing course workflow</title>
<desc id="desc">Animated marker moves through documentation fundamentals, writing in Google Docs and LaTeX, presenting with Beamer, documenting code with Doxygen, and sharing with Git and GitHub.</desc>
<defs><style>
.bg{fill:#f3f6fa}.heading{font:700 23px Arial,sans-serif;fill:#1d334b}.sub{font:14px Arial,sans-serif;fill:#496078}.card{fill:#fff;stroke:#a9bfd4;stroke-width:2}.number{font:700 13px Arial,sans-serif;fill:#fff}.line{stroke:#92a8bd;stroke-width:4;fill:none;stroke-linecap:round}
</style></defs>
<rect class="bg" width="1120" height="300" rx="20"/>
<text x="560" y="42" text-anchor="middle" class="heading">From clear documentation to a shareable portfolio</text>
<text x="560" y="66" text-anchor="middle" class="sub">Explore each tool, practise with an example, then explain what you learned.</text>
