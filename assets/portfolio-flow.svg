<circle cx="271" cy="129" r="13" fill="#315b83"/><text x="271" y="134" text-anchor="middle" class="number">2</text>
<text x="342" y="151" text-anchor="middle" class="heading" font-size="17">Write</text>
<text x="342" y="177" text-anchor="middle" class="sub">Google Docs · LaTeX</text>
</g>
<g>
<rect class="card" x="468" y="104" width="192" height="104" rx="12"/>
<circle cx="493" cy="129" r="13" fill="#315b83"/><text x="493" y="134" text-anchor="middle" class="number">3</text>
<text x="564" y="151" text-anchor="middle" class="heading" font-size="17">Present</text>
<text x="564" y="177" text-anchor="middle" class="sub">Beamer slides</text>
</g>
<g>
<rect class="card" x="690" y="104" width="192" height="104" rx="12"/>
<circle cx="715" cy="129" r="13" fill="#315b83"/><text x="715" y="134" text-anchor="middle" class="number">4</text>
<text x="786" y="151" text-anchor="middle" class="heading" font-size="17">Document code</text>
<text x="786" y="177" text-anchor="middle" class="sub">Doxygen</text>
</g>
